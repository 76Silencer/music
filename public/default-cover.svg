<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgGrad)"/>
  <!-- Decorative circles resembling a vinyl record -->
  <circle cx="150" cy="150" r="130" fill="none" stroke="#0f172a" stroke-width="6"/>
  <circle cx="150" cy="150" r="110" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="150" cy="150" r="90" fill="none" stroke="#1e293b" stroke-width="4"/>
  <!-- Music Note Icon -->
  <path d="M140 110 v60 a25 25 0 1 0 30 25 v-65 h40 v-20 h-70 z" fill="url(#iconGrad)"/>
</svg>